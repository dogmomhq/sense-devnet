<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Overlay Comparison</title>
<style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0b1120;
            --bg-secondary: #131d32;
            --accent: #00c8ff;
            --accent-dark: #00a0d4;
            --accent-glow: rgba(0, 200, 255, 0.25);
            --win: #00d4aa;
            --lose: #ff4757;
            --draw: #ffa502;
            --text-primary: #ffffff;
            --text-secondary: #7a8ba5;
            --border: #1e2d45;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, #0b1120 0%, #0e1a30 40%, #111f3a 100%);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            padding-bottom: 80px;
            position: relative;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background:
                linear-gradient(45deg, rgba(255,255,255,0.035) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.035) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.035) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.035) 75%);
            background-size: 80px 80px;
            background-position: 0 0, 0 40px, 40px -40px, -40px 0px;
            pointer-events: none; z-index: 0;
        }
        .container, .nav-bar, .preview-badge, .persistent-balance, .toast, .countdown-overlay { position: relative; z-index: 1; }

        @media (min-width: 769px) {
            body { padding-bottom: 0; padding-top: 60px; }
        }

        #play, #history, #landing, #leaderboard, #challenge-tab, #profile { overflow-y: auto; align-items: flex-start; }

        .container {
            width: 100%; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        .screen {
            position: absolute; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transform: translateY(20px);
            transition: all 0.5s ease;
            pointer-events: none; padding: 20px;
        }
        .screen.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .screen.exit { opacity: 0; transform: translateY(-20px); transition: all 0.3s ease; }

        /* PERSISTENT NAV BAR */
        .nav-bar {
            position: fixed; left: 0; right: 0;
            display: flex; justify-content: space-around; align-items: center;
            background: linear-gradient(to bottom, rgba(20, 35, 60, 0.98), rgba(11, 17, 32, 0.95)); border-top: 1px solid rgba(0, 200, 255, 0.1);
            backdrop-filter: blur(12px); z-index: 150;
            padding: 0; gap: 0;
        }

        @media (max-width: 768px) {
            .nav-bar { bottom: 0; height: 80px; flex-direction: row; }
            .nav-bar.hidden { display: none; }
        }

        @media (min-width: 769px) {
            .nav-bar { top: 0; height: 56px; border-bottom: 1px solid var(--border); border-top: none;
                padding: 0 20px; justify-content: flex-start; gap: 12px; }
            .nav-bar.hidden { display: none; }
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: none; border: none; cursor: pointer; color: var(--text-secondary);
            transition: all 0.3s ease; padding: 6px 12px; font-size: 13px; font-weight: 600;
            text-transform: none; letter-spacing: 0.2px; position: relative;
            gap: 4px;
        }

        @media (min-width: 769px) {
            .nav-item { flex-direction: row; gap: 8px; padding: 8px 20px; font-size: 13px;
                border-radius: 6px; }
        }

        .nav-item svg { width: 28px; height: 28px; stroke-width: 1.5; }

        .nav-item.active {
            color: var(--accent);
        }

        @media (min-width: 769px) {
            .nav-item.active { background: rgba(0, 200, 255, 0.08); }
        }

        .nav-label { display: block; }
        @media (min-width: 769px) {
            .nav-label { display: inline; }
        }

        .preview-badge {
            position: fixed; top: 12px; right: 12px;
            background: rgba(255, 165, 0, 0.9); color: #000;
            padding: 6px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
            z-index: 100; text-transform: uppercase;
        }

        .persistent-balance {
            display: none; align-items: center; gap: 4px;
            font-size: 12px; font-weight: 600;
            color: var(--accent); white-space: nowrap;
            margin-left: auto; padding: 0 12px;
        }
        .persistent-balance .bal-label { color: var(--text-secondary); font-weight: 400; font-size: 10px; margin-right: 2px; }
        .persistent-balance .bal-amount { font-variant-numeric: tabular-nums; }
        .persistent-balance.hidden { display: none !important; }

        @media (max-width: 768px) {
            .persistent-balance {
                position: fixed; bottom: 74px; left: 0; right: 0;
                justify-content: center; gap: 6px;
                background: rgba(11, 17, 32, 0.95); border-top: 1px solid var(--border);
                padding: 5px 12px; margin-left: 0; font-size: 11px;
                z-index: 149; backdrop-filter: blur(12px);
            }
        }

        /* LANDING - COMPACT */
        .landing-content { text-align: center; max-width: 500px; padding: 20px; margin: auto; display: flex; flex-direction: column; justify-content: center; min-height: calc(100vh - 90px); }

        .landing-top-bar {
            display: flex; align-items: center;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 18px; padding: 22px 24px; margin-bottom: 48px;
            gap: 0;
        }

        .landing-top-bar .wallet-icon {
            width: 48px; height: 48px; background: #2d8a4e;
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-right: 14px;
        }
        .landing-top-bar .wallet-icon svg { width: 26px; height: 26px; stroke: #fff; fill: none; }

        .landing-top-bar .wallet-section {
            display: flex; align-items: center; gap: 0;
            flex: 1;
        }

        .landing-top-bar .username-display {
            color: var(--text-primary); font-size: 18px; font-weight: 700;
            text-align: left; font-family: 'Courier New', monospace;
            line-height: 1.2; min-width: 80px;
        }

        .landing-top-bar .wallet-divider {
            width: 1px; height: 36px; background: var(--border);
            margin: 0 16px; flex-shrink: 0;
        }

        .landing-top-bar .balance-col {
            text-align: center; line-height: 1.3;
        }
        .landing-top-bar .balance-col .bal-label-top {
            font-size: 15px; color: var(--text-secondary); font-weight: 500;
        }
        .landing-top-bar .balance-col .bal-value {
            font-size: 22px; font-weight: 700; color: var(--accent);
        }

        .landing-top-bar .approved-col {
            text-align: center; line-height: 1.3;
        }
        .landing-top-bar .approved-col .approved-label {
            font-size: 15px; color: var(--text-secondary); font-weight: 500;
        }
        .landing-top-bar .approved-col .approved-value {
            font-size: 22px; font-weight: 700; color: var(--text-primary);
        }

        .landing-top-bar .balance-display {
            color: var(--accent); font-size: 13px; font-weight: 600;
            text-align: right; white-space: nowrap;
        }

        .tier-grid { display: flex; gap: 12px; margin-bottom: 40px; }

        .tier-card {
            background: linear-gradient(145deg, #1e2f4a, #182840);
            border: 2px solid rgba(255,255,255,0.07);
            border-radius: 18px; padding: 28px 8px; cursor: pointer;
            transition: all 0.3s ease; position: relative; overflow: hidden;
            min-height: 100px; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            flex: 1; aspect-ratio: 1 / 1.1;
        }
        /* Glass reflection on unselected cards */
        .tier-card::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.03) 35%, transparent 55%);
            pointer-events: none; border-radius: inherit;
        }
        .tier-card:hover { border-color: rgba(0, 200, 255, 0.3); transform: translateY(-1px); }
        .tier-card.selected {
            flex: 1.5;
            border-color: var(--accent);
            background: linear-gradient(145deg, rgba(0, 200, 255, 0.12), rgba(0, 100, 180, 0.1));
            box-shadow: 0 0 25px rgba(0, 200, 255, 0.5), 0 0 50px rgba(0, 200, 255, 0.2), inset 0 0 25px rgba(0, 200, 255, 0.08);
        }
        .tier-card.selected::after { display: none; }

        .tier-amount { font-size: 26px; font-weight: 800; color: var(--text-primary); margin-bottom: 2px; }
        .tier-card.selected .tier-amount { font-size: 32px; color: var(--accent); }
        .tier-count { font-size: 12px; color: var(--text-secondary); letter-spacing: 0.3px; font-weight: 500; }
        .tier-card.selected .tier-count { color: var(--accent); font-size: 14px; }

        .tier-check {
            position: absolute; top: 8px; right: 8px; width: 20px; height: 20px;
            background: rgba(0, 150, 255, 0.15); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .tier-check svg { width: 10px; height: 10px; stroke: var(--accent); stroke-width: 2.5; fill: none; }
        .tier-card.selected .tier-check { display: none; }

        .wallet-stats { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
        .wallet-stats-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
        .wallet-stats-label { font-size: 12px; color: var(--text-secondary); }
        .wallet-stats-value { font-size: 14px; font-weight: 600; color: var(--text-primary); font-family: 'Courier New', monospace; }
        .wallet-stats-value.accent { color: var(--accent); }
        .wallet-stats-value.warn { color: var(--draw); }
        .approve-more-link { color: var(--accent); font-size: 12px; cursor: pointer; text-decoration: underline; margin-left: 6px; }

        .connect-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none; color: #000; padding: 14px 32px; border-radius: 30px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; margin-bottom: 16px;
            width: 100%; max-width: 300px; letter-spacing: 0.5px;
        }
        .connect-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
        .connect-btn:disabled { opacity: 0.6; cursor: not-allowed; display: none; }

        .play-now-btn {
            background: linear-gradient(180deg, #faf8f4 0%, #f0ede6 30%, #e4e0d8 60%, #d8d4cc 100%);
            border: none; color: #1a1a2e;
            padding: 22px 48px; border-radius: 36px;
            font-size: 22px; font-weight: 900; cursor: pointer;
            transition: all 0.3s ease; margin: 8px 0 36px;
            width: 100%; max-width: 340px; letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 0 7px 0 #9a9690, 0 9px 24px rgba(0,0,0,0.45), inset 0 2px 0 rgba(255,255,255,0.6);
        }
        .play-now-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #8a8680, 0 10px 28px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.5); }
        .play-now-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 #8a8680, 0 4px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3); }

        .play-free-btn {
            background: transparent; border: 2px solid rgba(255,255,255,0.15);
            color: var(--text-secondary); padding: 14px 48px; border-radius: 32px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; width: 100%; max-width: 320px;
        }
        .play-free-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--text-primary); }

        /* SETUP */
        .setup-content { text-align: center; max-width: 600px; }
        .setup-title { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .setup-subtitle { font-size: 16px; color: var(--text-secondary); margin-bottom: 32px; }

        /* CHALLENGE TAB */
        .challenge-content { text-align: center; max-width: 500px; padding: 20px; margin: auto; }
        .challenge-title { font-size: 28px; font-weight: 700; margin-bottom: 24px; }
        .challenge-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none; color: #0b1120; padding: 14px 32px; border-radius: 30px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; width: 100%; max-width: 300px; margin-bottom: 16px;
        }
        .challenge-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }

        /* PROFILE TAB */
        .profile-content { text-align: center; max-width: 500px; padding: 20px; margin: auto; }
        .profile-title { font-size: 28px; font-weight: 700; margin-bottom: 24px; }
        .profile-section {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 14px; padding: 16px; margin-bottom: 14px; text-align: left;
        }
        .profile-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .profile-value { font-size: 14px; color: var(--text-primary); word-break: break-all; font-family: 'Courier New', monospace; margin-bottom: 8px; }
        .profile-value.clickable { cursor: pointer; color: var(--accent); }
        .profile-stat { display: inline-block; flex: 1; text-align: center; }
        .profile-stat-number { font-size: 24px; font-weight: 700; color: var(--accent); }
        .profile-stat-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; margin-top: 4px; }
        .profile-stats { display: flex; gap: 12px; }
        .profile-section .stat-card {
            background: var(--bg-primary); border: 1px solid var(--border);
            flex: 1; padding: 12px; border-radius: 8px; text-align: center;
        }
        .disconnect-btn {
            background: var(--lose); border: none; color: #fff; padding: 12px 24px;
            border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
            width: 100%; transition: all 0.3s ease;
        }
        .disconnect-btn:hover { opacity: 0.9; }

        /* WAITING FOR FRIEND */
        .waiting-content { text-align: center; max-width: 500px; }
        .waiting-title { font-size: 28px; font-weight: 700; margin-bottom: 16px; }
        .waiting-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 32px; }
        .share-link-box {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 14px; padding: 20px; margin-bottom: 24px; word-break: break-all;
        }
        .share-link-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .share-link-url { font-family: 'Courier New', monospace; font-size: 13px; color: var(--accent); line-height: 1.6; }
        .copy-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none; color: #0b1120; padding: 12px 32px; border-radius: 30px;
            font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
            width: 100%; max-width: 300px; margin-bottom: 16px;
        }
        .copy-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
        .cancel-link { color: var(--lose); cursor: pointer; font-size: 13px; text-decoration: underline; border: none; background: none; }

        .loader { display: inline-block; margin-bottom: 24px; }
        .dot { display: inline-block; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; margin: 0 6px; animation: bounce 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-12px); opacity: 1; } }

        .connection-status {
            display: inline-block; padding: 6px 16px; border-radius: 20px;
            font-size: 12px; font-weight: 600; margin-bottom: 24px;
        }
        .connection-status.waiting { background: rgba(255, 165, 0, 0.2); color: var(--draw); border: 1px solid rgba(255, 165, 0, 0.4); }
        .connection-status.connected { background: rgba(0, 200, 255, 0.1); color: var(--accent); border: 1px solid rgba(0, 200, 255, 0.3); }

        /* COUNTDOWN */
        .countdown-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b1120; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 200;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .countdown-overlay.active { opacity: 1; pointer-events: auto; }
        .countdown-number { font-size: 120px; font-weight: 700; color: var(--accent); animation: countPulse 0.8s ease-out; text-shadow: 0 0 60px var(--accent-glow); }
        .countdown-label { font-size: 18px; color: var(--text-secondary); margin-top: 16px; text-transform: uppercase; letter-spacing: 2px; }
        @keyframes countPulse { 0% { transform: scale(1.8); opacity: 0; } 50% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.95); opacity: 1; } }

        /* PLAY */
        .play-content { width: 100%; max-width: 700px; padding-bottom: 16px; }
        .players-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .player-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 6px 8px; text-align: center; }
        .player-card.you { border-color: var(--accent); box-shadow: 0 0 12px rgba(0, 200, 255, 0.1); }
        .player-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .player-name { font-size: 12px; font-family: 'Courier New', monospace; color: var(--text-primary); word-break: break-all; }

        .timer-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; }
        .timer-ring { position: relative; width: 90px; height: 90px; margin-bottom: 6px; }
        .timer-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .timer-circle-bg { fill: none; stroke: var(--border); stroke-width: 4; }
        .timer-circle { fill: none; stroke: var(--accent); stroke-width: 4; stroke-dasharray: 339.29; stroke-dashoffset: 0; stroke-linecap: round; }
        .timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
        .times-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 320px; }
        .time-block { text-align: center; }
        .time-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .time-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; font-family: 'Courier New', monospace; color: var(--text-primary); }
        .time-value.accent { color: var(--accent); }

        .question-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; text-align: center; }
        .question-text { font-size: 17px; font-weight: 600; line-height: 1.4; }
        .image-placeholder { border-radius: 8px; margin: 8px 0 0 0; text-align: center; min-height: 0; }
        .image-placeholder img { max-width: 100%; max-height: min(200px, 25vh); border-radius: 8px; object-fit: contain; background: rgba(0, 200, 255, 0.03); border: 1px solid var(--border); }

        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .answer-btn {
            background: var(--bg-secondary); border: 2px solid var(--border);
            color: var(--text-primary); padding: 14px 12px; border-radius: 12px;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
            position: relative; overflow: hidden;
        }
        .answer-btn:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
        .answer-btn.selected { border-color: var(--accent); background: linear-gradient(135deg, rgba(0, 200, 255, 0.12), rgba(0, 200, 255, 0.04)); box-shadow: 0 0 16px rgba(0, 200, 255, 0.15); }
        .answer-btn:disabled { cursor: not-allowed; }
        .answer-btn.correct { border-color: var(--win); background: linear-gradient(135deg, rgba(0, 212, 170, 0.2), rgba(0, 212, 170, 0.1)); }
        .answer-btn.wrong { border-color: var(--lose); background: linear-gradient(135deg, rgba(255, 71, 87, 0.2), rgba(255, 71, 87, 0.1)); }

        .waiting-message { text-align: center; padding: 14px; background: rgba(0, 200, 255, 0.08); border: 1px solid rgba(0, 200, 255, 0.25); border-radius: 12px; color: var(--accent); font-size: 14px; font-weight: 500; display: none; }
        .waiting-message.show { display: block; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0, 200, 255, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* RESULTS — compact single card */
        .results-content { text-align: center; max-width: 500px; }
        .result-banner { font-size: 20px; font-weight: 700; padding: 0; margin-bottom: 4px; animation: popIn 0.3s ease-out; display: inline-block; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .result-banner.win { color: var(--win); background: none; border: none; }
        .result-banner.loss { color: var(--lose); background: none; border: none; }
        .result-banner.draw { color: var(--draw); background: none; border: none; }

        .result-hero { margin-bottom: 12px; }
        .result-hero .payout-amount { font-size: 40px; font-weight: 800; margin: 0; line-height: 1.1; }
        .result-hero .payout-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

        .result-details { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; text-align: left; }
        .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: var(--text-secondary); font-size: 12px; }
        .detail-value { font-weight: 600; color: var(--text-primary); font-family: 'Courier New', monospace; font-size: 12px; }

        .payout-section { display: none; }
        .payout-label { font-size: 11px; }
        .payout-amount { font-size: 40px; }

        .results-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 400px; margin: 0 auto; }
        @media (max-width: 500px) { .results-buttons { grid-template-columns: 1fr; } }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); border: none; color: #0b1120; padding: 14px 24px; border-radius: 30px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
        .btn-secondary { background: var(--bg-secondary); border: 2px solid var(--border); color: var(--text-primary); padding: 12px 24px; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .btn-secondary:hover { border-color: var(--accent); transform: translateY(-2px); }

        /* HISTORY */
        .history-content { width: 100%; max-width: 600px; max-height: 100vh; overflow-y: auto; padding-bottom: 40px; }
        .history-title { font-size: 28px; font-weight: 700; margin-bottom: 20px; text-align: center; }
        .history-empty { text-align: center; color: var(--text-secondary); padding: 40px 20px; font-size: 14px; }
        .history-card {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 14px; margin-bottom: 10px; overflow: hidden; cursor: pointer;
            transition: border-color 0.2s;
        }
        .history-card:hover { border-color: var(--accent); }
        .history-card.pending { border-left: 3px solid var(--draw); }
        .history-summary {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; font-size: 13px;
        }
        .history-result { font-weight: 700; font-size: 13px; text-transform: uppercase; min-width: 60px; text-align: right; }
        .history-result.win { color: var(--win); }
        .history-result.loss { color: var(--lose); }
        .history-result.draw { color: var(--draw); }
        .history-result.pending { color: var(--draw); font-style: italic; }
        .history-meta { color: var(--text-secondary); font-size: 12px; }
        .history-opp { color: var(--text-primary); font-weight: 600; }
        .history-detail {
            display: none; padding: 0 16px 14px; border-top: 1px solid var(--border);
            font-size: 13px;
        }
        .history-card.open .history-detail { display: block; }
        .history-detail .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(42,42,62,0.5); }
        .history-detail .detail-row:last-child { border-bottom: none; }
        .history-detail .detail-label { color: var(--text-secondary); }
        .history-detail .detail-value { font-weight: 600; font-family: 'Courier New', monospace; }
        .history-badge { display: none; background: var(--draw); color: #000; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }

        /* USERNAME PROMPT */
        .username-prompt {
            display: none; margin-top: 12px; text-align: center;
        }
        .username-prompt.show { display: block; }
        .username-input {
            background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-primary);
            padding: 10px 14px; border-radius: 8px; font-size: 14px; width: 200px;
            text-align: center; outline: none; transition: border-color 0.3s;
        }
        .username-input:focus { border-color: var(--accent); }
        .username-save-btn {
            background: var(--accent); color: #000; border: none; padding: 10px 18px;
            border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
            margin-left: 8px; transition: opacity 0.3s;
        }
        .username-save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .username-error { color: var(--lose); font-size: 12px; margin-top: 6px; }
        .username-display {
            color: var(--accent); font-size: 16px; font-weight: 700; margin-top: 4px;
        }

        /* LEADERBOARD */
        .leaderboard-content { width: 100%; max-width: 600px; max-height: 100vh; overflow-y: auto; padding-bottom: 40px; }
        .leaderboard-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; text-align: center; }
        .leaderboard-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .leaderboard-tab {
            padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 600;
            cursor: pointer; border: 1px solid var(--border); background: transparent;
            color: var(--text-secondary); transition: all 0.3s;
        }
        .leaderboard-tab.active { background: var(--accent); color: #0b1120; border-color: var(--accent); }
        .lb-table { width: 100%; border-collapse: collapse; }
        .lb-table th {
            text-align: left; padding: 10px 12px; font-size: 11px; text-transform: uppercase;
            color: var(--text-secondary); letter-spacing: 0.5px; border-bottom: 1px solid var(--border);
        }
        .lb-table td {
            padding: 12px; font-size: 14px; border-bottom: 1px solid rgba(42,42,62,0.3);
        }
        .lb-table tr:hover td { background: rgba(0, 200, 255, 0.05); }
        .lb-rank { font-weight: 700; color: var(--accent); width: 40px; }
        .lb-name { font-weight: 600; }
        .lb-stat { font-variant-numeric: tabular-nums; color: var(--text-secondary); }
        .lb-pnl-pos { color: var(--win); }
        .lb-pnl-neg { color: var(--lose); }

        /* TOAST */
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: var(--bg-secondary); border: 1px solid var(--accent); color: var(--text-primary);
            padding: 12px 24px; border-radius: 8px; font-size: 13px; font-weight: 600;
            opacity: 0; transition: all 0.3s ease; z-index: 300; pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 600px) {
            .setup-title { font-size: 24px; }
            .result-banner { font-size: 18px; }
            .question-text { font-size: 16px; }
            .answer-btn { padding: 14px 12px; font-size: 13px; }
        }
    

/* Overlay controls */

    position: fixed; top: 10px; left: 10px; z-index: 9999;
    background: rgba(0,0,0,0.9); padding: 12px; border-radius: 8px;
    color: white; font-size: 12px; font-family: sans-serif;
}
